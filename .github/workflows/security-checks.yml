name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend security and tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend\requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Bandit
        run: bandit -r backend\authstatus_api backend\scripts -c backend\pyproject.toml

      - name: Run pip-audit
        run: python -m pip_audit -r backend\requirements.txt

      - name: Run Safety
        if: >
          github.event_name != 'pull_request' ||
          (
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: safety --key "$env:SAFETY_API_KEY" scan --target backend

      - name: Generate backend SBOM
        run: >
          cyclonedx-py environment
          --output-reproducible
          --output-file carequeue-backend.cdx.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carequeue-backend-sbom
          path: carequeue-backend.cdx.json
          if-no-files-found: error

      - name: Run backend tests
        run: pytest backend\tests -n auto -q

  frontend:
    name: Frontend audit and build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit

      - name: Generate frontend SBOM
        working-directory: frontend
        run: >
          npx @cyclonedx/cyclonedx-npm
          --output-reproducible
          --output-file ..\carequeue-frontend.cdx.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carequeue-frontend-sbom
          path: carequeue-frontend.cdx.json
          if-no-files-found: error

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
